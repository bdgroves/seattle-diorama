name: Render the film

# Renders the scripted fly-through frame by frame on GitHub's free machines
# (software WebGL, no GPU), split into parallel segments, then joins them.
# The finished videos land on the `film` branch and as a workflow artifact.
# Start it from the Actions tab ("Run workflow"), or by pushing to the
# `render-film` branch.
# Pushing to `render-film-<place>` (e.g. render-film-yosemite) also starts it.
on:
  push:
    branches: ['render-film', 'render-film-*']
  workflow_dispatch:
    inputs:
      place:
        description: "Place: seattle, yosemite, tuolumne, mono, amalfi or dakar"
        default: "seattle"
      res:
        description: "Resolution"
        default: "1920x1080"
      fps:
        description: "Frames per second"
        default: "30"
      segments:
        description: "Parallel segments"
        default: "20"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      place: ${{ steps.plan.outputs.place }}
    steps:
      - uses: actions/checkout@v7
      - name: Use the latest built scene
        run: |
          git fetch --depth 1 origin scene-data
          mkdir -p web/public/data
          git archive origin/scene-data | tar -x -C web/public/data
      - uses: prefix-dev/setup-pixi@v0.11.2
        with: { locked: false, cache: false }
      - run: pixi run bundle
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: web/dist }
      - id: plan
        name: Plan the segments
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re
          place = "${{ inputs.place }}" or "${{ github.ref_name }}".removeprefix("render-film").strip("-") or "seattle"
          print("place=" + place)
          import os
          if place == "seattle":
              src = open("web/src/places/seattle.js").read()
          elif os.path.exists(f"web/src/places/{place}.js"):
              src = open(f"web/src/places/{place}.js").read()
          else:
              src = open("web/src/places/sierra.js").read()
              src = src[src.index(f"id: '{place}'"):]
              src = src[:src.index("export const")] if "export const" in src else src
          film = src[src.index("film"):]
          duration = max(float(t) for t in re.findall(r"\{ t: ([0-9.]+),", film))
          fps, n = int("${{ inputs.fps || 30 }}"), int("${{ inputs.segments || 20 }}")
          frames = round(duration * fps)
          cuts = [round(i * frames / n) for i in range(n + 1)]
          segs = [{"i": f"{i:02d}", "start": cuts[i] / fps, "end": cuts[i + 1] / fps} for i in range(n)]
          print("matrix=" + json.dumps({"include": segs}))
          EOF

  render:
    needs: prepare
    # pinned: Playwright's --with-deps knows Ubuntu 24.04's packages
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: dist, path: web/dist }
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Install Playwright, Chromium and ffmpeg
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Render segment ${{ matrix.i }}
        run: >
          python pipeline/film.py --software-gl --quality best
          --res ${{ inputs.res || '1920x1080' }} --fps ${{ inputs.fps || 30 }}
          --start ${{ matrix.start }} --end ${{ matrix.end }}
          --place ${{ needs.prepare.outputs.place }}
          --out film/seg_${{ matrix.i }}.mp4
      - uses: actions/upload-artifact@v7
        with: { name: "seg-${{ matrix.i }}", path: "film/seg_${{ matrix.i }}.mp4" }

  assemble:
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    steps:
      - run: sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v8
        with: { pattern: "seg-*", path: film, merge-multiple: true }
      - name: Join the segments and make web versions
        run: |
          cd film
          ls seg_*.mp4 | sort | sed "s/^/file '/; s/$/'/" > list.txt
          P=${{ needs.prepare.outputs.place }}
          ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy master.mp4
          ffmpeg -y -loglevel error -i master.mp4 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart $P-diorama-1080.mp4
          ffmpeg -y -loglevel error -i master.mp4 -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart $P-diorama-720.mp4
          ffmpeg -y -loglevel error -ss 3 -i master.mp4 -frames:v 1 -q:v 2 $P-poster.jpg
          ls -la
      - name: Publish to the film branch
        run: |
          P=${{ needs.prepare.outputs.place }}
          mkdir -p /tmp/out && cd /tmp/out
          # keep the other places' films that are already on the branch
          git init -q -b film
          git fetch -q --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" film && git checkout -q FETCH_HEAD -- . 2>/dev/null || true
          cp $GITHUB_WORKSPACE/film/$P-diorama-1080.mp4 $GITHUB_WORKSPACE/film/$P-diorama-720.mp4 $GITHUB_WORKSPACE/film/$P-poster.jpg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "$P film ${{ inputs.res || '1920x1080' }} @ ${{ inputs.fps || 30 }} fps ($(date -u +%Y-%m-%d))"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" film
      - uses: actions/upload-artifact@v7
        with:
          name: diorama-film
          path: |
            film/*-diorama-1080.mp4
            film/*-diorama-720.mp4
            film/*-poster.jpg
