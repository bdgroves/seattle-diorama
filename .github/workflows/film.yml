name: Render the film

# Renders the scripted fly-through frame by frame on GitHub's free machines
# (software WebGL, no GPU), split into parallel segments, then joins them.
# The finished videos land on the `film` branch and as a workflow artifact.
# Start it from the Actions tab ("Run workflow"), or by pushing to the
# `render-film` branch.
on:
  push:
    branches: [render-film]
  workflow_dispatch:
    inputs:
      res:
        description: "Resolution"
        default: "1920x1080"
      fps:
        description: "Frames per second"
        default: "30"
      segments:
        description: "Parallel segments"
        default: "20"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Use the latest built scene
        run: |
          git fetch --depth 1 origin scene-data
          mkdir -p web/public/data
          git show origin/scene-data:scene.json > web/public/data/scene.json
      - uses: prefix-dev/setup-pixi@v0.11.2
        with: { locked: false, cache: false }
      - run: pixi run bundle
      - uses: actions/upload-artifact@v7
        with: { name: dist, path: web/dist }
      - id: plan
        name: Plan the segments
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re
          src = open("web/src/film.js").read()
          duration = max(float(t) for t in re.findall(r"\{ t: ([0-9.]+),", src))
          fps, n = int("${{ inputs.fps || 30 }}"), int("${{ inputs.segments || 20 }}")
          frames = round(duration * fps)
          cuts = [round(i * frames / n) for i in range(n + 1)]
          segs = [{"i": f"{i:02d}", "start": cuts[i] / fps, "end": cuts[i + 1] / fps} for i in range(n)]
          print("matrix=" + json.dumps({"include": segs}))
          EOF

  render:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with: { locked: false, cache: false }
      - uses: actions/download-artifact@v8
        with: { name: dist, path: web/dist }
      - run: pixi run python -m playwright install --with-deps chromium
      - name: Render segment ${{ matrix.i }}
        run: >
          pixi run python pipeline/film.py --software-gl --quality best
          --res ${{ inputs.res || '1920x1080' }} --fps ${{ inputs.fps || 30 }}
          --start ${{ matrix.start }} --end ${{ matrix.end }}
          --out film/seg_${{ matrix.i }}.mp4
      - uses: actions/upload-artifact@v7
        with: { name: "seg-${{ matrix.i }}", path: "film/seg_${{ matrix.i }}.mp4" }

  assemble:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.11.2
        with: { locked: false, cache: false }
      - uses: actions/download-artifact@v8
        with: { pattern: "seg-*", path: film, merge-multiple: true }
      - name: Join the segments and make web versions
        run: |
          cd film
          ls seg_*.mp4 | sort | sed "s/^/file '/; s/$/'/" > list.txt
          pixi run ffmpeg -y -loglevel error -f concat -safe 0 -i list.txt -c copy seattle-diorama-master.mp4
          pixi run ffmpeg -y -loglevel error -i seattle-diorama-master.mp4 -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart seattle-diorama-1080.mp4
          pixi run ffmpeg -y -loglevel error -i seattle-diorama-master.mp4 -vf scale=1280:-2 -c:v libx264 -preset veryfast -crf 23 -pix_fmt yuv420p -movflags +faststart seattle-diorama-720.mp4
          pixi run ffmpeg -y -loglevel error -ss 3 -i seattle-diorama-master.mp4 -frames:v 1 -q:v 2 poster.jpg
          ls -la
      - name: Publish to the film branch
        run: |
          mkdir -p /tmp/out && cp film/seattle-diorama-1080.mp4 film/seattle-diorama-720.mp4 film/poster.jpg /tmp/out/
          cd /tmp/out
          git init -q -b film
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Film render ${{ inputs.res || '1920x1080' }} @ ${{ inputs.fps || 30 }} fps ($(date -u +%Y-%m-%d))"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" film
      - uses: actions/upload-artifact@v7
        with:
          name: seattle-diorama-film
          path: |
            film/seattle-diorama-1080.mp4
            film/seattle-diorama-720.mp4
            film/poster.jpg
