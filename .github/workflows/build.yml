name: Build city & deploy

# Pulls fresh OpenStreetMap data, builds the scene, bundles the viewer and
# publishes it to GitHub Pages. The built scene.json is also pushed to the
# `scene-data` branch so it can be inspected or reused.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"   # weekly refresh of the map data (Mondays)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: false
          cache: false

      - name: Fetch OpenStreetMap
        run: pixi run fetch

      - name: Fetch terrain places (elevation + OSM)
        run: pixi run sierra-fetch

      - name: Fetch the Dakar Rally elevation
        continue-on-error: true
        run: pixi run dakar-fetch 2>&1 | tee dakar.log

      - name: Real 3D models from Wikidata / Commons
        run: pixi run models 2>&1 | tee models.log

      - name: Build scene
        run: pixi run build 2>&1 | tee build.log

      - name: Build terrain places (Yosemite, Tuolumne, Mono, Amalfi)
        run: pixi run sierra-build 2>&1 | tee -a build.log

      - name: Build the Dakar Rally 2027
        continue-on-error: true
        run: pixi run dakar-build 2>&1 | tee -a dakar.log

      - name: Keep raw OSM + build log on the debug-data branch
        if: always()
        run: |
          mkdir -p /tmp/dbg && cp data/raw/osm.json data/raw/*_osm.json data/raw/*_dem.npy data/raw/*_dem.src data/raw/models.json data/raw/models-report.txt build.log models.log dakar.log /tmp/dbg/ 2>/dev/null || true
          cd /tmp/dbg && [ -n "$(ls)" ] || exit 0
          git init -q -b debug-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Raw OSM + build log ($(date -u +%Y-%m-%d))"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" debug-data

      - name: Bundle the viewer
        run: pixi run bundle

      - name: Publish scene.json to the scene-data branch
        run: |
          mkdir -p /tmp/scene && cp web/public/data/*.json web/public/data/*.bin /tmp/scene/ && cp -r web/public/data/models /tmp/scene/ 2>/dev/null || true
          cd /tmp/scene
          git init -q -b scene-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Scene data from OSM ($(date -u +%Y-%m-%d))"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" scene-data

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
