<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seattle Diorama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="labels-on">
  <canvas id="c"></canvas>
  <div id="labels"></div>

  <header class="card title">
    <div class="eyebrow" id="eyebrow">Seattle, Washington</div>
    <h1 id="place-title">Seattle Center <em>to</em> Westlake</h1>
    <p id="blurb">The Needle, the Monorail and the Westin, rebuilt from open map data.</p>
    <div id="place-picker" class="picker"></div>
  </header>

  <nav class="card views">
    <div class="group-label">Fly to</div>
    <div id="views-list"></div>
    <div id="follows"></div>
    <div class="group-label" id="weather-label">Seattle</div>
    <button id="rain" class="toggle">Rain</button>
    <button id="live" class="toggle">Live sun</button>
    <div id="place-toggles"></div>
    <div class="group-label">Look</div>
    <button id="tilt" class="toggle">Miniature blur</button>
    <button id="lbl" class="toggle on">Labels</button>
    <button id="orbit" class="toggle">Slow orbit</button>
    <div class="group-label">Film</div>
    <button id="play">▶ Play the film</button>
    <button id="rec"><i class="dot rec"></i>Record video</button>
    <button id="photo">Photo · 4K</button>
    <button id="share">Copy link to view</button>
  </nav>

  <footer class="card time">
    <input id="time" type="range" min="0" max="1" step="0.001" />
    <div class="ticks"><span>Morning</span><span>Golden hour</span><span>Dusk</span><span>Night</span></div>
    <div id="clock"></div>
  </footer>

  <div id="meta"></div>
  <div id="fps"></div>
  <div id="loading">Building Seattle…</div>
  <div id="toast"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
